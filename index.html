<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Crystal Caos</title>

        <link rel="stylesheet" href="style.css" />
        <link
            rel="shortcut icon"
            href="assets/img/icon/favicon5.png"
            type="image/x-icon"
        />
    </head>
    <body onload="init()">
        <h1>Crystal Caos</h1>

        <img
            id="body-snake"
            src="./assets/img/stone_snake.png"
            alt="Stone Snake"
        />

        <div class="game-container">
            <canvas id="canvas" width="1280" height="720"></canvas>

            <div id="win-screen" class="game-overlay" style="display: none">
                <div class="overlay-content">
                    <h1>YOU WIN!</h1>
                    <button onclick="restartGame()">Neustart</button>
                    <button onclick="nextLevel()">Next Lvl</button>
                </div>
            </div>

            <div
                id="game-over-screen"
                class="game-overlay"
                style="display: none"
            >
                <div class="overlay-content">
                    <h1>GAME OVER</h1>
                    <button onclick="restartGame()">Neustart</button>
                </div>
            </div>
        </div>

        <div id="rotate-device-warning">
            <div class="warning-content">
                <h2>Bitte drehe dein Gerät!</h2>
                <p>Dieses Spiel funktioniert nur im Querformat (Landscape).</p>
            </div>
        </div>

        <script src="./scripts/game.js" type="module"></script>
    </body>
</html>
